# The private generation package: the code that writes the committed generated files, run by the `gen-*` recipes
# of the root `justfile`, which installs it on the fly with `uv run --with-editable ./gen`. It is not a member of
# the root project's workspace and not in its environment or lock, and it is never built or published: its version
# is a fixed `0.0.0`, and `Private :: Do Not Upload` marks it private.
#
# The root `pyproject.toml` holds the tooling configuration (ruff, ty, import-linter) that covers this package too.
# Generation code carries no tests: `just gen` leaving the tree clean is its check.
[project]
name = "lorecraft-gen"
version = "0.0.0"
description = "Private: the code and docs generators of the lorecraft repository"
requires-python = ">=3.12"
classifiers = [
    "Private :: Do Not Upload",
]
dependencies = [
    "lorecraft",
]

[tool.uv.sources]
lorecraft = { path = "..", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lorecraft_gen"]
