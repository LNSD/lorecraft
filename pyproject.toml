# The lorecraft package: one import package, `lorecraft`, in layers, each importing only those below it:
#
#   lorecraft.cli      the command line, console script `lorecraft`
#   lorecraft.engine   the runner that judges each rule from its query's facts, and each mode's policy for a failed layer
#   lorecraft.rules    the rules, how one is declared and identified, and the selection, table and report of a run
#   lorecraft.project  the workspace model and the parse trees, on the filesystem boundary
#   lorecraft.agents   the model of the coding agents: the aspects an agent has, and each agent's values
#   lorecraft.schemas  schema identities, provenance, immutable inputs, the bundled Agent Skills model and input, and pure registry lookup
#   lorecraft.vfs      the filesystem boundary: paths, views, scan, snapshot
#   lorecraft.jsonschema, lorecraft.yaml and lorecraft.markdown  peers directly above core: JSON Schema vocabulary;
#                      YAML syntax/refusals; the Markdown parse values
#   lorecraft.core     the base: the shared error class
#
# Unit tests sit beside their module under src/; tests/ holds the integration and end-to-end tiers.
[project]
name = "lorecraft"
dynamic = ["version"]
description = "Toolkit for the agent-facing documentation of a repository: rule documents, feature docs, skills and the format specifications that govern them"
readme = "README.md"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
authors = [
    { name = "Lorenzo Delgado", email = "lnsdev@proton.me" },
]
requires-python = ">=3.12"
keywords = [
    "agents",
    "agent-skills",
    "documentation",
    "lint",
    "specifications",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Documentation",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "jsonschema>=4.21,<5",
    "pydantic>=2.13,<3",
    "referencing>=0.37,<0.38",
    "ruamel.yaml>=0.19.1,<0.20",
    "tiktoken>=0.14,<0.15",
    "typer>=0.27.2",
    "wenmode>=0.15.1,<0.16",
]

[project.urls]
Homepage = "https://github.com/lnsd/lorecraft"
Documentation = "https://github.com/lnsd/lorecraft/tree/main/docs"
Repository = "https://github.com/lnsd/lorecraft"
Issues = "https://github.com/lnsd/lorecraft/issues"

# `lc` is a shorter name for the same command line.
[project.scripts]
lorecraft = "lorecraft.cli:main"
lc = "lorecraft.cli:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# The one place the uv version is stated: `astral-sh/setup-uv` in CI and a local `uv` both read it,
# and Renovate bumps it (see .github/renovate.json5).
[tool.uv]
required-version = "==0.13.0"

# The version's home is the git tag: hatch-vcs derives it at build time, so CI needs full history.
[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
local_scheme = "node-and-date"

# Unit tests sit in a `tests/` subpackage beside the module they test, inside src/. None of them ships:
# `tests/` is a gitignore-style pattern that matches such a directory at any depth, so both targets drop
# every one of them. Keeping them out is what lets a test import pytest without making it a dependency.
[tool.hatch.build.targets.wheel]
packages = ["src/lorecraft"]
exclude = ["tests/"]

# The include list keeps the sdist to the package source and its metadata files; without it hatchling ships
# the whole repository, docs/ and the test tiers included.
[tool.hatch.build.targets.sdist]
include = [
    "/src/lorecraft",
    "/README.md",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
]
exclude = ["tests/"]

[dependency-groups]
dev = [
    "faker>=40.40.0",
    "import-linter>=2.15,<3",
    "mutmut>=3.8.0",
    "ruff>=0.16.0",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "syrupy>=6.1.1",
    "ty>=0.0.83,<0.1",
]

[tool.pytest.ini_options]
testpaths = [
    "src",
    "tests/it",
    "tests/e2e",
]
# The helpers in tests/lib/ import as `lib`: the end-to-end tier's, and `lib.snapshot`, which every tier's
# snapshot tests read.
pythonpath = ["tests"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    # Unit test packages import under their real dotted name, so relative imports resolve; test files with
    # the same name in different integration and end-to-end directories never collide.
    "--import-mode=importlib",
]
markers = [
    "unit: Unit tests (fast, no external dependencies)",
    "it: Integration tests (the package's own modules wired together, in process)",
    "e2e: End-to-end tests (the installed console script, in a subprocess)",
]

[tool.coverage.run]
source = ["src/lorecraft"]
# Unit tests sit beside their module under src/; their own lines are not what coverage measures.
omit = ["*/tests/*"]
branch = true
# The e2e tier runs the installed console script in a subprocess; this measures it there too.
patch = ["subprocess"]

[tool.coverage.report]
skip_covered = true
sort = "Cover"

# mutmut swaps a mutant in inside the pytest process, so the e2e tier, which runs the installed console script
# in a subprocess, can never kill one; collection leaves tests/e2e/ out.
[tool.mutmut]
source_paths = ["src/lorecraft"]
# Unit tests sit beside their module under src/; mutating a test proves nothing about the tests.
do_not_mutate = ["*/tests/*"]
# Lines no mutant of can change what a caller sees: an arm the type checker proves unreachable, and the
# `__cause__` every raise site sets again with `from`.
do_not_mutate_patterns = [
    "assert_never\\(",
    "raise AssertionError\\(",
    "self\\.__cause__ = ",
]
pytest_add_cli_args_test_selection = ["src", "tests/it"]
# mutmut runs the tests from a copy under mutants/; the integration tests read the generated schemas, the
# specifications and every skill from the repository itself.
also_copy = ["docs/schemas", "docs/__meta__", ".agents/skills", "skills"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = [
    "src",
    "gen/src",
    "tests",
]
force-exclude = true
# The Markdown examples under docs/ are deliberately shaped to illustrate rules; never reformat them.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "D",    # pydocstyle
    "ANN",  # flake8-annotations, `Any` annotations (ANN401) included
    "PGH003", # a blanket `# type: ignore` names no rule
    "UP",   # pyupgrade
    "PYI055", # one `type[...]` over a union, not a union of `type[...]`
    "PT012", # a `pytest.raises` block holds the one statement that raises
    "PT018", # one fact per `assert`, not a compound one
]
ignore = [
    "D107", # the class docstring states what constructing it takes
]

# `*args: Any` and `**kwargs: Any` annotate the type of a single value, as docs/code/python-typing.md states.
[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true

[tool.ruff.lint.per-file-ignores]
# A test's name says what it pins; its module still carries a docstring.
"**/tests/**" = ["D101", "D102", "D103", "D106"]
# Typer prints a command's docstring as its `--help` and stops at a form feed, `\f`, which marks where the sections
# for code readers begin. A raw docstring would hold a backslash and an `f` instead, so these stay non-raw. The root
# callback in `cli/app.py` is left out: it raises nothing, so it has no section to cut. The rule is in
# docs/code/python-typer.md.
"src/lorecraft/cli/commands/**" = ["D301"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "single"

[tool.ty.environment]
root = [
    "src",
    "gen/src",
    # A unit test pins text output through `lib.snapshot`, which pytest imports from here through `pythonpath`.
    "tests",
]
python-version = "3.12"

# A warning fails the check as an error does, so a new one cannot land unnoticed.
[tool.ty.terminal]
error-on-warning = true

# The layers share one import package, so nothing in the packaging stops a lower layer importing a higher
# one. This contract does: each layer may import only the layers below it, run by `just check`.
[tool.importlinter]
root_package = "lorecraft"
# Needed so a contract can name a third-party package, as the one on the validators below does.
include_external_packages = true

[[tool.importlinter.contracts]]
name = "The command line over the engine, rules, model, agents, schemas, filesystem and base"
type = "layers"
containers = ["lorecraft"]
layers = [
    "cli",
    "engine",
    "rules",
    "project",
    "agents",
    "schemas",
    "vfs",
    "jsonschema|yaml|markdown",
    "core",
]

# The JSON Schema libraries are read in `lorecraft.jsonschema`, which gives callers owned schema and validation facts.
[[tool.importlinter.contracts]]
name = "The JSON Schema libraries are read in one package"
type = "forbidden"
source_modules = ["lorecraft"]
forbidden_modules = ["jsonschema", "referencing"]
ignore_imports = [
    "lorecraft.jsonschema.** -> jsonschema",
    "lorecraft.jsonschema.** -> referencing",
]
allow_indirect_imports = true

# Each frontmatter schema translates its validator's errors into `FrontmatterProblem` values at its own seam in
# `project.schemas`, so a check or a rule reads one shape whichever validator is behind it and never an error record.
[[tool.importlinter.contracts]]
name = "The rules read frontmatter problems, never a validator's errors"
type = "forbidden"
source_modules = ["lorecraft.rules"]
forbidden_modules = ["jsonschema", "pydantic", "pydantic_core"]
allow_indirect_imports = true

# The database sits in `lorecraft.project`, a layer below the rules, so the layers contract alone would let a rule
# import it. A rule reads only the facts its query is handed, so the database stays out of its reach by import.
[[tool.importlinter.contracts]]
name = "A rule reads its query's facts, never the database"
type = "forbidden"
source_modules = ["lorecraft.rules"]
forbidden_modules = ["lorecraft.project.database"]

# The agents are data over `lorecraft.core`. `vfs` sits below them in the layers contract, so that contract alone
# would let them import it; they state paths and never read a filesystem.
[[tool.importlinter.contracts]]
name = "The agents never import the filesystem"
type = "forbidden"
source_modules = ["lorecraft.agents"]
forbidden_modules = ["lorecraft.vfs"]

# A long-lived front end reaches the engine without the command line, so the engine never imports the command line's
# toolkit. The layers contract above already stops it importing `lorecraft.cli`.
[[tool.importlinter.contracts]]
name = "The engine never imports the command line's toolkit"
type = "forbidden"
source_modules = ["lorecraft.engine"]
forbidden_modules = ["typer"]

# `lorecraft_gen`, in `gen/`, imports `lorecraft` to render what it declares. It is not installed in this
# environment, so it is named as an external package: the contract reads the imports of `lorecraft` statically,
# and a generator imported by the package would ship in the wheel.
[[tool.importlinter.contracts]]
name = "The package never imports the generators"
type = "forbidden"
source_modules = ["lorecraft"]
forbidden_modules = ["lorecraft_gen"]

# The Markdown parser is read in `lorecraft.markdown` alone, which hands the rest of the package its own frozen
# values, so a parser upgrade changes that one package and no parser type reaches anything else.
[[tool.importlinter.contracts]]
name = "The Markdown parser is read in one package"
type = "forbidden"
source_modules = ["lorecraft"]
forbidden_modules = ["wenmode"]
ignore_imports = ["lorecraft.markdown.** -> wenmode"]

# The YAML library is read in `lorecraft.yaml` alone, which hands the rest of the package its own values, so a library
# upgrade changes that package and no library type reaches another.
[[tool.importlinter.contracts]]
name = "The YAML library is read in one package"
type = "forbidden"
source_modules = ["lorecraft"]
forbidden_modules = ["ruamel"]
ignore_imports = ["lorecraft.yaml.** -> ruamel"]

# `lorecraft.yaml.basic_yaml` is the grammar the library is bent to, whose names carry the library's types. The other
# packages read the package's values, problems and tree through its other modules, and never that grammar. A protected
# contract holds every importer outside `lorecraft.yaml`, the root package included, and a new package is held to it
# without this contract being edited.
[[tool.importlinter.contracts]]
name = "The YAML grammar is read inside its package"
type = "protected"
protected_modules = ["lorecraft.yaml.basic_yaml"]
allowed_importers = ["lorecraft.yaml"]
