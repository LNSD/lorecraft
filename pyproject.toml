# Virtual workspace root: never built.
#
#   packages/lorecraft-core     the base package: the shared error class (import `lorecraft_core`)
#   packages/lorecraft-vfs      the filesystem boundary: paths, views, scan, snapshot (import `lorecraft_vfs`)
#   packages/lorecraft-project  the workspace model on the filesystem boundary (import `lorecraft_project`)
#   packages/lorecraft          the command line (import `lorecraft`, console script `lorecraft`)
#   tests                       the end-to-end suites and their helpers: private, never built
#
# The version comes from the git tag (hatch-vcs), shared by every package, so CI needs full history.
[tool.uv.workspace]
members = [
    "packages/*",
    "tests",
]

[tool.uv.sources]
lorecraft = { workspace = true }
lorecraft-core = { workspace = true }
lorecraft-project = { workspace = true }
lorecraft-vfs = { workspace = true }

[dependency-groups]
dev = [
    "lorecraft",
    "lorecraft-core",
    "lorecraft-project",
    "lorecraft-vfs",
    "ruff>=0.16.0",
    "pytest>=9.0.3",
    "syrupy>=6.1.1",
    "ty>=0.0.83,<0.1",
]

[tool.pytest.ini_options]
# Unit tests sit beside their module under src/, integration tests in each package's tests/.
testpaths = [
    "packages/*/src",
    "packages/*/tests",
    "tests/e2e",
]
# The end-to-end helpers in tests/lib/ import as `lib`.
pythonpath = ["tests"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    # Unit test packages import under their real dotted name, so relative imports resolve; test files with
    # the same name in different integration and end-to-end directories never collide.
    "--import-mode=importlib",
]
markers = [
    "unit: Unit tests (fast, no external dependencies)",
    "it: Integration tests (the package's own modules wired together, in process)",
    "e2e: End-to-end tests (the installed console script, in a subprocess)",
]

[tool.ruff]
line-length = 120
target-version = "py312"
src = [
    "packages/*/src",
    "tests",
]
force-exclude = true
# The Markdown examples under docs/ are deliberately shaped to illustrate rules; never reformat them.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
]

[tool.ruff.format]
quote-style = "single"

[tool.ty.environment]
root = [
    "packages/lorecraft-core/src",
    "packages/lorecraft-project/src",
    "packages/lorecraft-vfs/src",
    "packages/lorecraft/src",
]
python-version = "3.12"
