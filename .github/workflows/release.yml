name: release
on:
  release:
    types: [published]

permissions: {}

# Never cancel a publish halfway through an upload.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  ## Build
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # hatch-vcs derives the version from the tags a shallow clone lacks.
          fetch-depth: 0
          persist-credentials: false

      # The release form can create a lightweight tag on the fly, which carries no signature.
      - name: Check the tag is signed and on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "${GITHUB_REF_NAME}" in
            v*) ;;
            *) echo "::error::Release tag '${GITHUB_REF_NAME}' does not start with 'v'"; exit 1 ;;
          esac

          tag_ref="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}")"
          if [ "$(jq -r .object.type <<< "${tag_ref}")" != "tag" ]; then
            echo "::error::Tag '${GITHUB_REF_NAME}' is lightweight; release from a signed annotated tag"
            exit 1
          fi

          tag_sha="$(jq -r .object.sha <<< "${tag_ref}")"
          verified="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_sha}" --jq .verification.verified)"
          if [ "${verified}" != "true" ]; then
            echo "::error::Tag '${GITHUB_REF_NAME}' does not carry a verified signature"
            exit 1
          fi

          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::Tag '${GITHUB_REF_NAME}' points at a commit that is not on main"
            exit 1
          fi

      # No cache, so a cache poisoned by another workflow run cannot reach the release build.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.20'
          enable-cache: false

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: '1.58.0'

      - name: Sync the development environment
        run: uv sync --all-groups --locked

      # A tag can point at a commit CI never ran on.
      - name: Run the gates
        run: just fmt-check && just check && just typecheck && just test && just check-docs && just check-skills

      - name: Build
        run: just clean && just build

      # A `.dev` or `+local` version means the build did not happen on the tagged commit.
      - name: Check the artifacts carry the tag's version
        run: |
          version="${GITHUB_REF_NAME#v}"
          ls -la dist/
          test -f "dist/lorecraft-${version}.tar.gz"
          test -f "dist/lorecraft-${version}-py3-none-any.whl"
          # `uv build` also writes a `dist/.gitignore` holding `*`; it is no artifact, so it is not counted.
          test "$(find dist/ -mindepth 1 ! -name .gitignore | wc -l)" -eq 2

      # The workspace tests cannot see a dependency the wheel fails to declare.
      - name: Install the wheel alone
        run: |
          uv venv dist-verify
          uv pip install --python dist-verify dist/*.whl
          dist-verify/bin/lorecraft version
          dist-verify/bin/lorecraft check

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  ## Publish
  # PyPI's trusted publisher is registered against this file name and the `pypi` environment;
  # renaming either breaks publishing.
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/lorecraft/
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
